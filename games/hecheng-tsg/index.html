  <style>:root {

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; overflow-x: hidden; }
body {

  min-height: 100svh;

button { font: inherit; }
#app {

}

  aspect-ratio: 420 / 620;
  border-radius: 18px;
  background: #fffaf2;
  touch-action: none;
}

.hint { position: absolute; left: 0; right: 0; bottom: 9px; text-align: center; font-size: 10px; letter-spacing: .02em; opacity: .47; pointer-events: none; }

.modal[hidden] { display: none; }
.modal-card { width: min(330px, 100%); padding: 24px; border-radius: 24px; background: #fffaf2; box-shadow: 0 24px 70px rgba(42,30,21,.28); }
.modal-card h2 { margin: 2px 0 18px; font-size: 28px; }
.result-row { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--line); }
.result-row span { opacity: .6; font-size: 13px; }
.result-row strong { font-size: 22px; font-variant-numeric: tabular-nums; }
.primary-button { width: 100%; margin-top: 15px; padding: 13px; border-radius: 15px; color: white; background: var(--accent); font-weight: 800; box-shadow: 0 8px 20px rgba(231,111,81,.28); }
@media (max-width: 390px) {
  #app { padding-left: 10px; padding-right: 10px; }
  .hud { gap: 5px; }
  .hud-card { height: 54px; padding: 6px; border-radius: 12px; }
  .hud-card strong { font-size: 16px; }
  .next-card img { width: 40px; height: 40px; }
  .game-shell { border-radius: 20px; padding-left: 6px; padding-right: 6px; }
}
@media (min-width: 800px) {
  #app {
    width: min(100%, 680px);
    padding-top: 24px;
    padding-left: 18px;
    padding-right: 18px;
  }

  .eyebrow { font-size: 11px; }
  h1 { font-size: 42px; }
  .ghost-button { padding: 10px 14px; }

  .hud-card { height: 66px; padding: 9px 10px; border-radius: 16px; }
  .hud-card span { font-size: 11px; }
  .hud-card strong { font-size: 21px; }
  .next-card img { width: 50px; height: 50px; right: 4px; }
  .game-shell { max-width: 560px; border-radius: 28px; padding: 10px 10px 36px; }
  #gameCanvas { border-radius: 20px; }
  .warning-label { top: calc(10px + 16.9%); right: 19px; font-size: 10px; }
  .hint { bottom: 11px; font-size: 11px; }
}

  const Core = window.TSGCore;
  const app = document.getElementById('app');
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreValue = document.getElementById('scoreValue');

  const levelValue = document.getElementById('levelValue');

  const finalLevel = document.getElementById('finalLevel');
  const restartButton = document.getElementById('restartButton');
  const restartTopButton = document.getElementById('restartTopButton');
  const viewportProbe = document.getElementById('viewportProbe');

  const WIDTH = 420;
  const HEIGHT = 620;
  const WARNING_Y = 105;
  const STEP = 1 / 60;
  const SPAWN_Y = 50;
  const sprites = new Array(12);
  let state;
  let current = null;
  let nextLevel = 1;
  let activePointerId = null;
  let cooldownUntil = 0;

  function randomSpawnLevel() {

    if (r < 0.42) return 1;
    if (r < 0.70) return 2;
    if (r < 0.86) return 3;
    if (r < 0.95) return 4;
    return 5;

    lastTime = performance.now();
    cooldownUntil = 0;
    nextLevel = randomSpawnLevel();

    state.highestLevel = Math.max(state.highestLevel, current.level);

      while (accumulator >= STEP) {
        simulate(STEP);
        accumulator -= STEP;
        if (state.gameOver) break;
      }
      spawnControlled(false);
    }
    draw();
    requestAnimationFrame(frame);
  }

  if (!Core) {
    reportError('TSGCore 未加载');
    return;
  }

  preloadSprites().then(() => {
    resetGame();
    updateViewportProbe();
    app.dataset.ready = 'true';
    if (window.__tsgErrors && window.__tsgErrors.length) reportError(window.__tsgErrors.join(' | '));
    requestAnimationFrame(frame);
  }).catch(error => reportError(error.message || error));
})();
</script>
</body>
</html>
