    const bands = 10;
    const visibleHeight = maxY - minY + 1;
    const visualSize = Math.min(300, Core.LEVEL_RADII[level] * 2.9);
    const worldScale = visualSize / Math.max(width, height);
    const rects = [];
    for (let band = 0; band < bands; band++) {
      const y0 = Math.floor(minY + visibleHeight * band / bands);
      const y1 = Math.max(y0 + 1, Math.floor(minY + visibleHeight * (band + 1) / bands));
      const occupied = new Uint8Array(width);
      for (let y = y0; y < Math.min(height, y1); y++) {
        for (let x = minX; x <= maxX; x++) {
          if (pixels[(y * width + x) * 4 + 3] >= alphaThreshold) occupied[x] = 1;
        }
      }

      let runStart = -1;
      let lastSolid = -1;
      let gap = 0;
      const flushRun = () => {
        if (runStart < 0 || lastSolid < runStart) return;
        const left = (runStart - width / 2) * worldScale;
        const right = (lastSolid + 1 - width / 2) * worldScale;
        const top = (y0 - height / 2) * worldScale;
        const bottom = (Math.min(height, y1) - height / 2) * worldScale;
        if (right - left >= 1.1 && bottom - top >= 0.8) rects.push({ left, right, top, bottom });
      };

      for (let x = minX; x <= maxX + 1; x++) {
        const solid = x <= maxX && occupied[x];
        if (solid) {
          if (runStart < 0) runStart = x;
          lastSolid = x;
          gap = 0;
        } else if (runStart >= 0) {
          gap++;
          if (gap > 2 || x > maxX) {
            flushRun();
            runStart = -1;
            lastSolid = -1;
            gap = 0;
          }
        }
      }
    }
    if (!rects.length) return null;
    const bounds = {
      left: Math.min(...rects.map(r => r.left)),
      right: Math.max(...rects.map(r => r.right)),
      top: Math.min(...rects.map(r => r.top)),
      bottom: Math.max(...rects.map(r => r.bottom)),
    };
    const area = rects.reduce((sum, r) => sum + (r.right - r.left) * (r.bottom - r.top), 0);
    return { rects, bounds, area };
  }

  function installCollisionProfiles() {
    const profiles = {};
    let totalRects = 0;
    for (let level = 1; level <= 11; level++) {
      try {
        const profile = buildCollisionProfile(sprites[level], level);
        if (profile) {
          profiles[level] = profile;
          totalRects += profile.rects.length;
        }
      } catch (_) {
        // If canvas pixel access is unavailable, Core falls back to its old circle-like profile.
      }
    }
    Core.setCollisionProfiles(profiles);
    app.dataset.collision = Object.keys(profiles).length === 11 ? 'outline' : 'outline-fallback';
    app.dataset.hitboxRects = String(totalRects);
  }

  function updateViewportProbe() {
    const overflow = document.documentElement.scrollWidth > window.innerWidth + 1;
    viewportProbe.dataset.overflow = overflow ? 'true' : 'false';
  }

  function resetGame() {
    state = { bodies: [], score: 0, highestLevel: 1, overflowTime: 0, gameOver: false };
    activePointerId = null;
    accumulator = 0;
    lastTime = performance.now();
    cooldownUntil = 0;
    nextLevel = randomSpawnLevel();
    spawnControlled(true);
    modal.hidden = true;
    syncHud();
  }

  function spawnControlled(force) {
    if (state.gameOver || current || (!force && performance.now() < cooldownUntil)) return;
    const level = nextLevel;
    nextLevel = randomSpawnLevel();
    current = { level, x: WIDTH / 2, y: SPAWN_Y };
    nextPreview.src = spritePath(nextLevel);
  }

  function dropCurrent() {
    if (!current || state.gameOver) return;
    const body = Core.createBody(current.level, current.x, current.y, 0, 0);
    body.released = true;
    state.bodies.push(body);
    state.highestLevel = Math.max(state.highestLevel, current.level);
    current = null;
    cooldownUntil = performance.now() + 330;
  }

  function pointerX(event) {
    const rect = canvas.getBoundingClientRect();
    return (event.clientX - rect.left) * (WIDTH / rect.width);
  }

  function moveCurrentTo(x) {
    if (!current) return;
    const bounds = Core.getCollisionProfile(current.level).bounds;
    current.x = Math.max(-bounds.left, Math.min(WIDTH - bounds.right, x));
  }

  canvas.addEventListener('pointerdown', event => {
    if (event.button !== 0 && event.pointerType === 'mouse') return;
    event.preventDefault();
    activePointerId = event.pointerId;
    try { canvas.setPointerCapture(event.pointerId); } catch (_) {}
    moveCurrentTo(pointerX(event));
  });
  canvas.addEventListener('pointermove', event => {
    if (event.pointerType === 'mouse' || event.pointerId === activePointerId) {
      event.preventDefault();
      moveCurrentTo(pointerX(event));
    }
  });
  canvas.addEventListener('pointerup', event => {
    if (event.pointerId !== activePointerId && event.pointerType !== 'mouse') return;
    event.preventDefault();
    moveCurrentTo(pointerX(event));
    dropCurrent();
    activePointerId = null;
  });
  canvas.addEventListener('pointercancel', event => {
    if (event.pointerId === activePointerId) activePointerId = null;
  });
  canvas.addEventListener('contextmenu', event => event.preventDefault());

  restartButton.addEventListener('click', resetGame);
  restartTopButton.addEventListener('click', resetGame);
  window.addEventListener('resize', updateViewportProbe, { passive: true });

  function syncHud() {
    scoreValue.textContent = String(state.score);
    levelValue.textContent = `Lv${state.highestLevel}`;
    if (state.score > bestScore) {
      bestScore = state.score;
      saveBestScore();
    }
    bestScoreValue.textContent = String(bestScore);
  }

  function finishGame() {
    if (!state.gameOver) state.gameOver = true;
    syncHud();
    finalScore.textContent = String(state.score);
    finalLevel.textContent = `Lv${state.highestLevel}`;
    modal.hidden = false;
  }

  function drawSticker(level, x, y, radius, alpha) {
    const image = sprites[level];
    if (!image) return;
    const size = Math.min(300, radius * 2.9);
    const sourceWidth = image.naturalWidth || image.width || 1;
    const sourceHeight = image.naturalHeight || image.height || 1;
    const scale = size / Math.max(sourceWidth, sourceHeight);
    const drawWidth = sourceWidth * scale;
    const drawHeight = sourceHeight * scale;
    ctx.save();
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(image, x - drawWidth / 2, y - drawHeight / 2, drawWidth, drawHeight);
    ctx.restore();
  }

  function drawHitbox(level, x, y) {
    if (!SHOW_HITBOX) return;
    const profile = Core.getCollisionProfile(level);
    ctx.save();
    ctx.strokeStyle = 'rgba(255, 40, 70, .78)';
    ctx.lineWidth = 1;
    for (const rect of profile.rects) {
      ctx.strokeRect(x + rect.left, y + rect.top, rect.right - rect.left, rect.bottom - rect.top);
    }
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, WIDTH, HEIGHT);
    const bg = ctx.createLinearGradient(0, 0, 0, HEIGHT);
    bg.addColorStop(0, '#fffaf3');
    bg.addColorStop(1, '#f8e8d1');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    ctx.save();
    ctx.strokeStyle = 'rgba(231,111,81,.52)';
    ctx.setLineDash([8, 7]);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, WARNING_Y);
    ctx.lineTo(WIDTH, WARNING_Y);
    ctx.stroke();
    ctx.restore();

    ctx.strokeStyle = 'rgba(74,55,40,.13)';
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, WIDTH - 2, HEIGHT - 2);

    const ordered = state.bodies.slice().sort((a, b) => a.level - b.level);
    for (const body of ordered) {
      drawSticker(body.level, body.x, body.y, body.radius, 1);
      drawHitbox(body.level, body.x, body.y);
    }

    if (current && !state.gameOver) {
      const r = Core.LEVEL_RADII[current.level];
      ctx.save();
      ctx.strokeStyle = 'rgba(90,70,50,.18)';
      ctx.setLineDash([4, 8]);
      ctx.beginPath();
      ctx.moveTo(current.x, current.y + Core.getCollisionProfile(current.level).bounds.bottom);
      ctx.lineTo(current.x, Math.min(HEIGHT, current.y + 120));
      ctx.stroke();
      ctx.restore();
      drawSticker(current.level, current.x, current.y, r, 0.94);
      drawHitbox(current.level, current.x, current.y);
    }

    if (state.overflowTime > 0 && !state.gameOver) {
      const progress = Math.min(1, state.overflowTime / 1.8);
      ctx.fillStyle = `rgba(231,111,81,${0.08 + progress * 0.12})`;
      ctx.fillRect(0, 0, WIDTH, WARNING_Y);
    }
  }

  function simulate(dt) {
    Core.stepPhysics(state, dt, { width: WIDTH, height: HEIGHT });
    const pairs = Core.collectMergePairs(state.bodies);
    if (pairs.length) Core.applyMerges(state, pairs);
    Core.updateOverflowTimer(state, dt, WARNING_Y);
    if (state.gameOver) finishGame();
    syncHud();
  }

  function frame(now) {
    const elapsed = Math.min(0.08, Math.max(0, (now - lastTime) / 1000));
    lastTime = now;
    if (!state.gameOver) {
      accumulator += elapsed;
      while (accumulator >= STEP) {
        simulate(STEP);
        accumulator -= STEP;
        if (state.gameOver) break;
      }
      spawnControlled(false);
    }
    draw();
    requestAnimationFrame(frame);
  }

  if (!Core) {
    reportError('TSGCore 未加载');
    return;
  }

  preloadSprites().then(() => {
    installCollisionProfiles();
    resetGame();
    updateViewportProbe();
    app.dataset.ready = 'true';
    if (window.__tsgErrors && window.__tsgErrors.length) reportError(window.__tsgErrors.join(' | '));
    requestAnimationFrame(frame);
  }).catch(error => reportError(error.message || error));
})();
</script>
</body>
</html>
